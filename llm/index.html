<style>
  .pipe-node rect { fill: var(--surface-page); stroke: var(--rule-strong); transition: fill var(--dur-1) linear, stroke var(--dur-1) linear; }
  .pipe-node text { font: 500 14px var(--f-body); fill: var(--text); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .pipe-node .no { font: 600 10px var(--f-mono); fill: var(--accent); letter-spacing: .08em; }
  .pipe-node { cursor: pointer; outline: none; }
  .pipe-node.on rect, .pipe-node:focus-visible rect { fill: var(--surface-ink); stroke: var(--surface-ink); }
  .pipe-node.on text, .pipe-node:focus-visible text { fill: var(--text-on-ink); }
  .pipe-node.on .no, .pipe-node:focus-visible .no { fill: var(--data-hi); }
  .pipe-data text { font: 500 11px var(--f-mono); fill: var(--text-muted); text-anchor: middle; }
  .pipe-line { fill: none; stroke: var(--rule-strong); stroke-width: 1.2; }
  .pipe-loop { fill: none; stroke: var(--accent); stroke-width: 1.2; stroke-dasharray: 5 5; }
  .pipe-pulse { fill: var(--accent); }

  .ch-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule-strong); }
  .ch-list a {
    display: grid; grid-template-columns: 5.5rem minmax(0, 4fr) minmax(0, 5fr) auto; gap: var(--s-5); align-items: baseline;
    padding: var(--s-5) var(--s-3) var(--s-5) 0; border-bottom: 1px solid var(--rule); text-decoration: none;
    transition: background var(--dur-1) linear;
  }
  .ch-list a:hover, .ch-list a.on { background: var(--surface-raised); color: inherit; }
  .ch-no { font: 300 3rem/1 var(--f-display); color: var(--text-faint); font-variant-numeric: tabular-nums; padding-left: var(--s-3); transition: color var(--dur-1) linear; }
  .ch-list a:hover .ch-no, .ch-list a.on .ch-no { color: var(--accent); }
  .ch-title { font: 700 1.35rem/1.3 var(--f-display); }
  .ch-title small { display: block; font: italic 400 .9rem/1.4 var(--f-display); color: var(--text-muted); }
  .ch-sum { color: var(--text-muted); font-size: .95rem; }
  .ch-lab { display: flex; align-items: baseline; gap: var(--s-2); margin-top: var(--s-2); font-size: .86rem; color: var(--text); }
  .ch-lab .lab-tag { margin-left: 0; }
  .ch-go { font: 500 .78rem var(--f-mono); color: var(--text-muted); white-space: nowrap; }
  .ch-list a:hover .ch-go { color: var(--accent); }
  @media (max-width: 860px) {
    .ch-list a { grid-template-columns: 3.6rem minmax(0, 1fr); gap: var(--s-1) var(--s-4); }
    .ch-no { font-size: 2.2rem; grid-row: span 2; }
    .ch-go { display: none; }
  }
  .list-head { display: flex; justify-content: space-between; align-items: baseline; margin: var(--s-8) 0 var(--s-3); }
  .list-head h2 { margin: 0; font: 700 1.6rem/1.2 var(--f-display); }
</style>

<main id="main" class="page">
  <ol class="crumbs">
    <li><a href="../index.html">圖解手記</a></li>

  </ol>

  <header class="chapter-head">
    <p class="chapter-num" aria-hidden="true">0<span class="num-accent">1</span></p>
    <div>
      <p class="meta-label">分類 01 · 6 章</p>
      <h1 class="chapter-title">LLM 理論<span class="en">Large Language Models, illustrated</span></h1>
      <p class="chapter-deck">大型語言模型說穿了只做一件事：根據前文，預測下一個 token。這個分類把這件事拆成六個環節，每一章對應管線上的一站。建議依序閱讀，也可以直接從管線圖點進你好奇的那一站。</p>
    </div>
  </header>

  <figure class="plate" id="fig-0-1">
    <div class="plate-head">
      <span class="plate-fig">FIG 0.1</span>
      <h2 class="plate-title">從文字到下一個字：整條管線與六個章節</h2>
      <button class="btn btn-ghost btn-sm" type="button" id="pipe-toggle" aria-pressed="true">暫停</button>
    </div>
    <div class="plate-stage">
      <div class="stage-scroll"><svg class="stage-svg" id="pipe" viewBox="0 0 1040 250" role="img" aria-label="LLM 管線：文字經過分詞、嵌入、注意力與 Transformer 區塊、取樣，產出下一個字；訓練以虛線回饋調整所有權重。"></svg></div>
      <p class="scroll-hint">← 可橫向捲動 →</p>
    </div>
    <p class="plate-cap">實線是推論時資料的流向；虛線是訓練時誤差往回傳、調整每一站權重的路徑。點任一站可以直接跳到該章。</p>
  </figure>

  <div class="list-head">
    <h2>章節</h2>
    <span class="meta-label">建議依序閱讀</span>
  </div>
  <ol class="ch-list" id="ch-list"></ol>
</main>

<footer class="site-foot"><div class="site-foot-inner">

<script src="../assets/js/catalog.js"></script>
<script src="../assets/js/site.js"></script>
<script>
(function () {
  "use strict";
  var track = FL_CATALOG.categories.filter(function (c) { return c.id === "llm"; })[0];
  var list = document.getElementById("ch-list");
  var rows = {};
  track.chapters.forEach(function (c) {
    var a = FL.el("a", { href: c.slug + ".html" }, FL.el("li", {}, list));
    FL.el("span", { class: "ch-no", text: c.no }, a);
    var t = FL.el("span", { class: "ch-title", text: c.title }, a);
    FL.el("small", { text: c.en }, t);
    var sum = FL.el("span", { class: "ch-sum", text: c.summary }, a);
    if (c.lab) {
      var lab = FL.el("span", { class: "ch-lab" }, sum);
      FL.el("span", { class: "lab-tag", text: "動手做" }, lab);
      lab.appendChild(document.createTextNode(c.lab));
    }
    FL.el("span", { class: "ch-go", text: "閱讀 →" }, a);
    rows[c.no] = a;
  });

  /* ---- 管線圖 ---- */
  var S = FL.svg, svg = document.getElementById("pipe");
  var Y = 110, H = 56;
  var NODES = [
    { no: "01", label: "分詞", x: 150, w: 100 },
    { no: "02", label: "嵌入", x: 385, w: 100 },
    { no: "03", label: "自注意力", x: 590, w: 110 },
    { no: "04", label: "FFN · 殘差", x: 730, w: 110 },
    { no: "05", label: "取樣", x: 930, w: 100 }
  ];
  var DATA = [
    { x: 45, t: "「我喜歡喝」" },
    { x: 268, t: "[37, 912, 5021]" },
    { x: 478, t: "向量 × 3" },
    { x: 832, t: "logits" },
    { x: 1012, t: "「咖啡」" }
  ];
  // Transformer 區塊外框（03 + 04 重複 N 次）
  S("rect", { x: 522, y: Y - H / 2 - 22, width: 276, height: H + 44, fill: "none", stroke: "var(--rule)", "stroke-dasharray": "2 3" }, svg);
  S("text", { x: 528, y: Y - H / 2 - 30, text: "TRANSFORMER BLOCK × N", style: "font:600 10px var(--f-mono);fill:var(--text-muted);letter-spacing:.1em" }, svg);

  var main = S("path", { class: "pipe-line", d: "M 70 " + Y + " H 990", "marker-end": "" }, svg);
  S("path", { d: "M 986 " + (Y - 4) + " l 6 4 l -6 4", fill: "none", stroke: "var(--rule-strong)" }, svg);
  var gData = S("g", { class: "pipe-data" }, svg);
  DATA.forEach(function (d) { S("text", { x: d.x, y: Y - 14, text: d.t }, gData); });

  // 訓練回饋迴圈
  var loop = S("path", { class: "pipe-loop", d: "M 930 " + (Y + H / 2) + " V 214 H 150 V " + (Y + H / 2) }, svg);
  [385, 590, 730].forEach(function (x) { S("path", { class: "pipe-loop", d: "M " + x + " 214 V " + (Y + H / 2 + 4) }, svg); });
  var tg = S("g", { class: "pipe-node", tabindex: "0", role: "link", "aria-label": "第 06 章 訓練與對齊" }, svg);
  S("rect", { x: 470, y: 200, width: 140, height: 30, rx: 2 }, tg);
  S("text", { class: "no", x: 496, y: 215, text: "06" }, tg);
  S("text", { x: 556, y: 215, text: "訓練與對齊" }, tg);
  var nodeEls = { "06": tg };

  NODES.forEach(function (n) {
    var g = S("g", { class: "pipe-node", tabindex: "0", role: "link", "aria-label": "第 " + n.no + " 章 " + n.label }, svg);
    S("rect", { x: n.x - n.w / 2, y: Y - H / 2, width: n.w, height: H, rx: 2 }, g);
    S("text", { class: "no", x: n.x, y: Y - 11, text: n.no }, g);
    S("text", { x: n.x, y: Y + 9, text: n.label }, g);
    nodeEls[n.no] = g;
  });

  Object.keys(nodeEls).forEach(function (no) {
    var g = nodeEls[no], ch = track.chapters.filter(function (c) { return c.no === no; })[0];
    function hl(on) { g.classList.toggle("on", on); rows[no].classList.toggle("on", on); }
    g.addEventListener("mouseenter", function () { hl(true); });
    g.addEventListener("mouseleave", function () { hl(false); });
    g.addEventListener("focus", function () { hl(true); });
    g.addEventListener("blur", function () { hl(false); });
    g.addEventListener("click", function () { location.href = ch.slug + ".html"; });
    g.addEventListener("keydown", function (e) { if (e.key === "Enter") location.href = ch.slug + ".html"; });
    rows[no].addEventListener("mouseenter", function () { g.classList.add("on"); });
    rows[no].addEventListener("mouseleave", function () { g.classList.remove("on"); });
  });

  // 沿主線移動的脈衝（可暫停；reduced-motion 時不播放）
  var pulse = S("circle", { class: "pipe-pulse", r: 5, cx: 70, cy: Y }, svg);
  var len = main.getTotalLength(), t0 = null, raf, running = !FL.reducedMotion();
  function frame(now) {
    if (t0 == null) t0 = now;
    var p = ((now - t0) / 5200) % 1;
    var pt = main.getPointAtLength(p * len);
    pulse.setAttribute("cx", pt.x);
    raf = requestAnimationFrame(frame);
  }
  var toggle = document.getElementById("pipe-toggle");
  function set(on) {
    running = on;
    toggle.setAttribute("aria-pressed", on ? "true" : "false");
    toggle.textContent = on ? "暫停" : "播放";
    cancelAnimationFrame(raf);
    if (on) { t0 = null; raf = requestAnimationFrame(frame); }
  }
  toggle.addEventListener("click", function () { set(!running); });
  set(running);
})();
</script>
</body>
